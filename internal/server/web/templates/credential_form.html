{{define "credform"}}
<h1>{{if .Editing}}编辑凭据{{else}}新增凭据{{end}}</h1>
{{if .Editing}}
<form class="card" method="post" action="/credentials/{{.Editing.ID}}">
{{else}}
<form class="card" method="post" action="/credentials">
{{end}}
  <label>名称 <input name="name" value="{{if .Editing}}{{.Editing.Name}}{{end}}" required></label>
  <label>CF Token <input name="token" type="password" autocomplete="new-password" placeholder="{{if .Editing}}{{.Editing.TokenMasked}}（留空不修改）{{else}}输入 API Token{{end}}" {{if not .Editing}}required{{end}}></label>
  <label>CF Zone ID <input name="zone_id" value="{{if .Editing}}{{.Editing.ZoneID}}{{end}}" required></label>
  <label>CF Account ID <input name="account_id" value="{{if .Editing}}{{.Editing.AccountID}}{{end}}" required></label>
  <label>备注 <input name="remark" value="{{if .Editing}}{{.Editing.Remark}}{{end}}"></label>
  {{if .Editing}}
  <label><input type="checkbox" name="enabled" {{if .Editing.Enabled}}checked{{end}}> 启用</label>
  {{end}}
  <button type="submit">保存</button>
</form>
{{end}}
