{{define "credform"}}
<header class="page-header">
  <div><p class="page-eyebrow">DNS 服务</p><h1>{{if .Editing}}编辑凭据{{else}}新增凭据{{end}}</h1><p class="page-description">Token 仅用于 Cloudflare DNS 验证，请使用最小权限配置。</p></div>
</header>
{{if .Editing}}
<form class="glass-panel section-stack" method="post" action="/credentials/{{.Editing.ID}}">
{{else}}
<form class="glass-panel section-stack" method="post" action="/credentials">
{{end}}
  <div class="field-grid">
    <div class="field">
      <label class="field-label" for="credential-name">名称</label>
      <input id="credential-name" name="name" value="{{if .Editing}}{{.Editing.Name}}{{end}}" required>
    </div>
    <div class="field">
      <label class="field-label" for="credential-token">CF Token</label>
      <input id="credential-token" name="token" type="password" autocomplete="new-password" placeholder="{{if .Editing}}{{.Editing.TokenMasked}}（留空不修改）{{else}}输入 API Token{{end}}" aria-describedby="token-help" {{if not .Editing}}required{{end}}>
      <span class="hint" id="token-help">{{if .Editing}}留空将保留当前 Token。{{else}}建议仅授予目标 Zone 的 DNS 编辑权限。{{end}}</span>
    </div>
    <div class="field">
      <label class="field-label" for="zone-id">CF Zone ID</label>
      <input id="zone-id" name="zone_id" value="{{if .Editing}}{{.Editing.ZoneID}}{{end}}" required>
    </div>
    <div class="field">
      <label class="field-label" for="account-id">CF Account ID</label>
      <input id="account-id" name="account_id" value="{{if .Editing}}{{.Editing.AccountID}}{{end}}" required>
    </div>
    <div class="field field-full">
      <label class="field-label" for="credential-remark">备注</label>
      <input id="credential-remark" name="remark" value="{{if .Editing}}{{.Editing.Remark}}{{end}}" placeholder="可选">
    </div>
    {{if .Editing}}
    <label class="checkbox-field field-full" for="credential-enabled"><input id="credential-enabled" type="checkbox" name="enabled" {{if .Editing.Enabled}}checked{{end}}><span>启用此凭据</span></label>
    {{end}}
  </div>
  <div class="form-actions"><a class="button button-secondary" href="/credentials">取消</a><button type="submit">保存凭据</button></div>
</form>
{{end}}
