{{define "credentials"}}
<h1>Cloudflare 凭据</h1>
<p class="muted"><a href="/credentials/new">+ 新增凭据</a></p>

<table>
  <thead><tr><th>名称</th><th>Zone ID</th><th>Account ID</th><th>Token</th><th>状态</th><th>操作</th></tr></thead>
  <tbody>
  {{range .Creds}}
    <tr>
      <td>{{.Name}}</td>
      <td><code>{{.ZoneID}}</code></td>
      <td><code>{{.AccountID}}</code></td>
      <td><code>{{.TokenMasked}}</code></td>
      <td><span class="badge {{if .Enabled}}success{{else}}pending{{end}}">{{if .Enabled}}启用{{else}}禁用{{end}}</span></td>
      <td><a href="/credentials/{{.ID}}/edit">编辑</a></td>
    </tr>
  {{else}}
    <tr><td colspan="6" class="muted">暂无凭据。</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
