{{define "certificate-row"}}
<tr id="cert-{{.ID}}" {{if .Running}}hx-get="/certificates/{{.ID}}/row" hx-trigger="load delay:2s" hx-target="this" hx-swap="outerHTML"{{end}}>
  <td><strong>{{.RootDomain}}</strong></td>
  <td>
    <span class="badge {{.IssueStatus}}">{{.IssueStatusLabel}}</span>
    {{if .LastError}}<span class="tooltip" title="{{.LastError}}">!</span>{{end}}
  </td>
  <td>{{.ExpiresAt}}</td>
  <td>{{.KeyType}}</td>
  <td>
    {{if .Running}}
      <button disabled>签发中</button>
    {{else}}
      <button hx-post="/certificates/{{.ID}}/issue" hx-target="#cert-{{.ID}}" hx-swap="outerHTML">签发</button>
    {{end}}
    <button hx-post="/certificates/{{.ID}}/deploy" hx-target="#cert-{{.ID}}" hx-swap="outerHTML" {{if not .CanDeploy}}disabled{{end}}>下发</button>
  </td>
</tr>
{{end}}

{{define "certificates"}}
<h1>证书</h1>
<p class="muted"><a href="/certificates/new">+ 新建证书</a></p>

<table>
  <thead><tr><th>域名</th><th>状态</th><th>到期时间</th><th>私钥算法</th><th>操作</th></tr></thead>
  <tbody>
  {{range .Certs}}
    {{template "certificate-row" .}}
  {{else}}
    <tr><td colspan="5" class="muted">暂无证书。</td></tr>
  {{end}}
  </tbody>
</table>
{{end}}
