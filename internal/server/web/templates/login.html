{{define "login"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · oh-my-acme</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body>
<main class="auth">
  <form class="card" method="post" action="{{if .Setup}}/setup{{else}}/login{{end}}">
    <h1>oh-my-acme</h1>
    {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
    {{if .Setup}}
      <p class="muted">首次初始化，请设置管理员。</p>
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>初始化令牌<input name="setup_token" required></label>
      <button type="submit">初始化</button>
    {{else}}
      <label>用户名<input name="username" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">登录</button>
    {{end}}
  </form>
</main>
</body>
</html>{{end}}
